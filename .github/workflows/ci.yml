name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --all-targets
        run: cargo test --all-targets

      - name: cargo test --doc
        run: cargo test --doc

  quality:
    name: fmt, clippy and MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: install MSRV toolchain (1.70)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70"

      - name: cargo +1.70 build --all-targets (MSRV check)
        run: cargo +1.70 build --all-targets

  dogfood:
    name: the example is the README's evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build the library and the example
        run: cargo build --release --example compare

      # The README quotes this example's output verbatim as "real, observed
      # output." This job is what keeps that claim honest: it runs the
      # release binary and diffs it byte-for-byte against a fixture checked
      # into the repo, so a change to any limiter's behaviour that would
      # silently make the README's quoted output stale fails CI instead.
      - name: run the comparison example and check its output exactly
        run: |
          set -euo pipefail
          ./target/release/examples/compare > actual-output.txt
          diff -u tests/fixtures/compare-output.txt actual-output.txt
